<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cash Counting App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto;scroll-padding-top:20px;scroll-padding-bottom:24px}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#74ebd5,#acb6e5);min-height:100vh;min-height:100svh;display:block;padding:20px;overflow-x:hidden;overflow-y:auto}
body::before{content:"";position:fixed;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.18);top:-100px;left:-100px;filter:blur(2px);pointer-events:none}
body::after{content:"";position:fixed;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14);bottom:-80px;right:-60px;pointer-events:none}
.container{position:relative;z-index:1;background:rgba(255,255,255,.94);padding:24px;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.18);width:95%;max-width:750px;margin:0 auto 20px;opacity:0;transform:translateY(18px);animation:pageLoad .55s ease-out forwards}
h1{text-align:center;font-size:1.9em;margin-bottom:28px;color:#333}
.input-section{background:#f9fafb;padding:20px;border-radius:16px;margin-bottom:24px;border:2px solid #e5e7eb}
.input-section h2{font-size:1.1em;color:#555;margin-bottom:16px;text-align:center}
.flex-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.item{flex:1 1 60px;min-width:60px;display:flex;flex-direction:column;align-items:center;background:#fff;padding:11px 7px;border-radius:13px;border:1px solid #e5e7eb}
label{font-size:.85em;margin-bottom:7px;font-weight:700;color:#555}
input[type=number]{width:60px;padding:8px 5px;border-radius:9px;border:2px solid #ccc;text-align:center;font-size:.95em;outline:none}
input[type=number]:focus{border-color:#00796b;box-shadow:0 0 0 4px rgba(0,121,107,.12);background:#f0fffe}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.result{margin-top:0;text-align:center;font-size:1.8em;font-weight:700;color:#00796b;min-height:58px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,121,107,.08),rgba(76,175,80,.08));border-radius:14px;border:2px solid rgba(0,121,107,.2)}
@keyframes pageLoad{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.container{opacity:1;transform:none;animation:none}}
@media(max-width:500px){body{padding:12px}.container{padding:18px;width:100%;margin:0 auto 20px}.input-section{padding:14px;margin-bottom:18px}.item{flex:1 1 42px;min-width:42px}input[type=number]{width:44px}.result{font-size:1.4em}}
@media(max-width:500px) and (max-height:700px){.container{margin-top:4px}h1{font-size:1.6em;margin-bottom:20px}.input-section{padding:12px;margin-bottom:14px}.flex-row{gap:9px}.item{padding:8px 5px}.result{margin-top:0}}
</style>
</head>
<body>
<div class="container" id="app">
<h1>💰 Cash Counting</h1>
<div class="input-section">
<h2>Amount Enter Karein</h2>
<div class="flex-row">
<div class="item"><label for="note2000">₹2000</label><input type="number" id="note2000" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="note500">₹500</label><input type="number" id="note500" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="note200">₹200</label><input type="number" id="note200" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="note100">₹100</label><input type="number" id="note100" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="note50">₹50</label><input type="number" id="note50" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="note20">₹20</label><input type="number" id="note20" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="coin10">₹10</label><input type="number" id="coin10" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="coin5">₹5</label><input type="number" id="coin5" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="coin2">₹2</label><input type="number" id="coin2" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="coin1">₹1</label><input type="number" id="coin1" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
</div>
</div>
<div class="result" id="result" aria-live="polite">Total Cash: ₹0</div>
</div>
<script>
const values=[2000,500,200,100,50,20,10,5,2,1];
const inputs=[...document.querySelectorAll('input[type="number"]')];
const result=document.getElementById('result');
let keyboardOpen=false;let visibilityTimers=[];let visibilityFrame=0;
function formatCurrency(value){return `Total Cash: ₹${Math.max(0,Math.round(value)).toLocaleString('en-IN')}`}
function getTotal(){return inputs.reduce((total,input,index)=>{const value=Number(input.value);return total+(Number.isFinite(value)&&value>0?Math.floor(value):0)*values[index]},0)}
function calculateTotal(){result.textContent=formatCurrency(getTotal())}
function resetAll(){inputs.forEach(input=>{input.value=''});calculateTotal();inputs[0]?.focus()}
function clearCurrentInput(input){if(!input)return;input.value='';calculateTotal()}
function moveToInput(index){if(index<0||index>=inputs.length)return;inputs[index].focus();inputs[index].select();scheduleInputVisibility(inputs[index])}
function adjustCurrentInput(input,delta){if(!input)return;const current=Math.max(0,Math.floor(Number(input.value)||0));input.value=String(Math.max(0,current+delta));calculateTotal();scheduleInputVisibility(input)}
function keyboardIsOpen(){if(!window.visualViewport)return keyboardOpen;return window.innerHeight-window.visualViewport.height>80}
function keepInputVisible(input){if(!input||document.activeElement!==input||!document.body.contains(input))return;if(!keyboardIsOpen()&&window.visualViewport)return;const viewport=window.visualViewport;const visibleHeight=viewport?viewport.height:window.innerHeight;const viewportTop=viewport?viewport.offsetTop:0;const rect=input.getBoundingClientRect();const targetY=viewportTop+visibleHeight*.75;const delta=rect.top+(rect.height/2)-targetY;if(Math.abs(delta)>8)window.scrollBy({top:delta,behavior:'auto'})}
function scheduleInputVisibility(input){visibilityTimers.forEach(clearTimeout);visibilityTimers=[];cancelAnimationFrame(visibilityFrame);const run=()=>{if(document.activeElement===input)keepInputVisible(input)};visibilityFrame=requestAnimationFrame(run);[60,160,300,500,800].forEach(delay=>visibilityTimers.push(setTimeout(run,delay)))}
inputs.forEach(input=>{input.addEventListener('input',()=>{if(input.value!==''&&Number(input.value)<0)input.value='0';if(input.value.includes('.'))input.value=String(Math.floor(Number(input.value)));calculateTotal();scheduleInputVisibility(input)});input.addEventListener('focus',()=>{keyboardOpen=true;scheduleInputVisibility(input)});input.addEventListener('blur',()=>{input.value=input.value===''?'':String(Math.max(0,Math.floor(Number(input.value)||0)))})});
document.addEventListener('keydown',event=>{const active=document.activeElement;const focusedInput=active?.matches('input[type="number"]')?active:null;const modifier=event.ctrlKey||event.metaKey;if(modifier&&event.key.toLowerCase()==='r'){event.preventDefault();resetAll();return}if(modifier&&event.key==='Backspace'){event.preventDefault();resetAll();return}if(modifier&&event.key==='Enter'){event.preventDefault();calculateTotal();return}if(!focusedInput)return;if(event.key==='Enter'){event.preventDefault();const index=inputs.indexOf(focusedInput);moveToInput(event.shiftKey?index-1:index+1);return}if(event.key==='Escape'){event.preventDefault();clearCurrentInput(focusedInput);return}if(event.key==='+'||event.key==='ArrowUp'){event.preventDefault();adjustCurrentInput(focusedInput,1);return}if(event.key==='-'||event.key==='ArrowDown'){event.preventDefault();adjustCurrentInput(focusedInput,-1)}});
document.addEventListener('pointerdown',event=>{if(!event.target.closest('input[type="number"]'))keyboardOpen=false});
document.addEventListener('focusin',event=>{if(event.target.matches('input[type="number"]')){keyboardOpen=true;scheduleInputVisibility(event.target)}});
if(window.visualViewport){const handleViewportChange=()=>{const active=document.activeElement;if(active?.matches('input[type="number"]')){keyboardOpen=true;scheduleInputVisibility(active)}};window.visualViewport.addEventListener('resize',handleViewportChange);window.visualViewport.addEventListener('scroll',handleViewportChange)}
calculateTotal();
</script>
</body>
</html>
