<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cash Counting App</title>
<style>
:root{
  --bg:#f5f7fa;
  --surface:#ffffff;
  --surface-soft:#f8fafc;
  --border:#e2e8f0;
  --border-strong:#cbd5e1;
  --text:#0f172a;
  --muted:#64748b;
  --accent:#0f766e;
  --accent-soft:#ecfdf5;
  --accent-border:#99f6e4;
  --shadow:0 12px 32px rgba(15,23,42,.08);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto;scroll-padding:20px}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  min-height:100svh;
  padding:32px 16px;
  overflow-x:hidden;
}

.container{
  width:min(100%,720px);
  margin:0 auto;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:28px;
  opacity:0;
  transform:translateY(18px);
  animation:pageLoad .55s ease-out forwards;
}

.header{text-align:center;margin-bottom:28px}
h1{
  font-size:clamp(1.6rem,4vw,2rem);
  line-height:1.2;
  letter-spacing:-.02em;
  color:var(--text);
  margin-bottom:8px;
}
.header p{font-size:.95rem;color:var(--muted)}

.input-section{
  background:var(--surface-soft);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
}
.input-section h2{
  font-size:1rem;
  font-weight:650;
  color:var(--text);
  margin-bottom:16px;
}

.flex-row{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
}

.item{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  background:var(--surface);
  padding:12px 8px;
  border:1px solid var(--border);
  border-radius:10px;
}

label{font-size:.8rem;font-weight:650;color:var(--muted)}

input[type=number]{
  width:100%;
  max-width:78px;
  min-height:40px;
  padding:8px 6px;
  border:1px solid var(--border-strong);
  border-radius:8px;
  background:#fff;
  color:var(--text);
  text-align:center;
  font:inherit;
  font-size:.95rem;
  outline:none;
}
input[type=number]:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(15,118,110,.12);
}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.result{
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px 18px;
  border:1px solid var(--accent-border);
  border-radius:12px;
  background:var(--accent-soft);
  color:var(--accent);
  text-align:center;
  font-size:clamp(1.25rem,4vw,1.6rem);
  font-weight:750;
  letter-spacing:-.01em;
}

@keyframes pageLoad{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}

@media(prefers-reduced-motion:reduce){
  .container{opacity:1;transform:none;animation:none}
}

@media(max-width:620px){
  body{padding:16px 12px}
  .container{padding:20px;border-radius:14px}
  .header{margin-bottom:22px}
  .input-section{padding:16px}
  .flex-row{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .item{padding:10px 6px}
}

@media(max-width:420px){
  .flex-row{grid-template-columns:repeat(3,minmax(0,1fr))}
  input[type=number]{max-width:68px}
  .result{min-height:58px}
}
</style>
</head>
<body>
<div class="container" id="app">
  <header class="header">
    <h1>Cash Counting</h1>
    <p>Enter the quantity of each denomination</p>
  </header>

  <section class="input-section" aria-labelledby="amount-heading">
    <h2 id="amount-heading">Cash Denominations</h2>
    <div class="flex-row">
      <div class="item"><label for="note2000">₹2000</label><input type="number" id="note2000" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
      <div class="item"><label for="note500">₹500</label><input type="number" id="note500" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
      <div class="item"><label for="note200">₹200</label><input type="number" id="note200" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
      <div class="item"><label for="note100">₹100</label><input type="number" id="note100" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
      <div class="item"><label for="note50">₹50</label><input type="number" id="note50" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
      <div class="item"><label for="note20">₹20</label><input type="number" id="note20" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
      <div class="item"><label for="coin10">₹10</label><input type="number" id="coin10" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
      <div class="item"><label for="coin5">₹5</label><input type="number" id="coin5" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
      <div class="item"><label for="coin2">₹2</label><input type="number" id="coin2" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
      <div class="item"><label for="coin1">₹1</label><input type="number" id="coin1" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
    </div>
  </section>

  <div class="result" id="result" aria-live="polite">Total Cash: ₹0</div>
</div>

<script>
const values=[2000,500,200,100,50,20,10,5,2,1];
const inputs=[...document.querySelectorAll('input[type="number"]')];
const result=document.getElementById('result');
let keyboardOpen=false;
let visibilityTimers=[];
let visibilityFrame=0;

function formatCurrency(value){return `Total Cash: ₹${Math.max(0,Math.round(value)).toLocaleString('en-IN')}`}

function getTotal(){
 return inputs.reduce((total,input,index)=>{
   const value=Number(input.value);
   return total+(Number.isFinite(value)&&value>0?Math.floor(value):0)*values[index];
 },0);
}

function calculateTotal(){result.textContent=formatCurrency(getTotal())}

function resetAll(){
 inputs.forEach(input=>{input.value='';});
 calculateTotal();
 inputs[0]?.focus();
}

function clearCurrentInput(input){
 if(!input)return;
 input.value='';
 calculateTotal();
}

function moveToInput(index){
 if(index<0||index>=inputs.length)return;
 inputs[index].focus();
 inputs[index].select();
 scheduleInputVisibility(inputs[index]);
}

function adjustCurrentInput(input,delta){
 if(!input)return;
 const current=Math.max(0,Math.floor(Number(input.value)||0));
 input.value=String(Math.max(0,current+delta));
 calculateTotal();
 scheduleInputVisibility(input);
}

function keyboardIsOpen(){
 if(!window.visualViewport)return keyboardOpen;
 return window.innerHeight-window.visualViewport.height>80;
}

function keepInputVisible(input){
 if(!input||document.activeElement!==input||!document.body.contains(input))return;
 if(!keyboardIsOpen()&&window.visualViewport)return;
 const viewport=window.visualViewport;
 const visibleHeight=viewport?viewport.height:window.innerHeight;
 const viewportTop=viewport?viewport.offsetTop:0;
 const rect=input.getBoundingClientRect();
 const targetY=viewportTop+visibleHeight*.75;
 const delta=rect.top+(rect.height/2)-targetY;
 if(Math.abs(delta)>8)window.scrollBy({top:delta,behavior:'auto'});
}

function scheduleInputVisibility(input){
 visibilityTimers.forEach(clearTimeout);
 visibilityTimers=[];
 cancelAnimationFrame(visibilityFrame);
 const run=()=>{if(document.activeElement===input)keepInputVisible(input)};
 visibilityFrame=requestAnimationFrame(run);
 [60,160,300,500,800].forEach(delay=>visibilityTimers.push(setTimeout(run,delay)));
}

inputs.forEach(input=>{
 input.addEventListener('input',()=>{
   if(input.value!==''&&Number(input.value)<0)input.value='0';
   if(input.value.includes('.'))input.value=String(Math.floor(Number(input.value)));
   calculateTotal();
   scheduleInputVisibility(input);
 });
 input.addEventListener('focus',()=>{
   keyboardOpen=true;
   scheduleInputVisibility(input);
 });
 input.addEventListener('blur',()=>{
   input.value=input.value===''?'':String(Math.max(0,Math.floor(Number(input.value)||0)));
 });
});

document.addEventListener('keydown',event=>{
 const active=document.activeElement;
 const focusedInput=active?.matches('input[type="number"]')?active:null;
 const modifier=event.ctrlKey||event.metaKey;
 if(modifier&&event.key.toLowerCase()==='r'){event.preventDefault();resetAll();return}
 if(modifier&&event.key==='Backspace'){event.preventDefault();resetAll();return}
 if(modifier&&event.key==='Enter'){event.preventDefault();calculateTotal();return}
 if(!focusedInput)return;
 if(event.key==='Enter'){
   event.preventDefault();
   const index=inputs.indexOf(focusedInput);
   moveToInput(event.shiftKey?index-1:index+1);
   return;
 }
 if(event.key==='Escape'){event.preventDefault();clearCurrentInput(focusedInput);return}
 if(event.key==='+'||event.key==='ArrowUp'){event.preventDefault();adjustCurrentInput(focusedInput,1);return}
 if(event.key==='-'||event.key==='ArrowDown'){event.preventDefault();adjustCurrentInput(focusedInput,-1)}
});

document.addEventListener('pointerdown',event=>{
 if(!event.target.closest('input[type="number"]'))keyboardOpen=false;
});

document.addEventListener('focusin',event=>{
 if(event.target.matches('input[type="number"]')){
   keyboardOpen=true;
   scheduleInputVisibility(event.target);
 }
});

if(window.visualViewport){
 const handleViewportChange=()=>{
   const active=document.activeElement;
   if(active?.matches('input[type="number"]')){
     keyboardOpen=true;
     scheduleInputVisibility(active);
   }
 };
 window.visualViewport.addEventListener('resize',handleViewportChange);
 window.visualViewport.addEventListener('scroll',handleViewportChange);
}

calculateTotal();
</script>
</body>
</html>
