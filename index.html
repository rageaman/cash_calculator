<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cash Counting App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:20px;scroll-padding-bottom:24px}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#74ebd5,#acb6e5);min-height:100vh;min-height:100svh;display:block;padding:20px;overflow-x:hidden;overflow-y:auto}
.container{position:relative;z-index:1;background:rgba(255,255,255,.94);padding:24px;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.18);width:95%;max-width:750px;margin:0 auto 20px;animation:containerIn .6s .1s both cubic-bezier(.22,1,.36,1)}
h1{text-align:center;font-size:1.9em;margin-bottom:28px;color:#333;animation:titleIn .8s .15s both cubic-bezier(.22,1,.36,1)}
.input-section{background:#f9fafb;padding:20px;border-radius:16px;margin-bottom:24px;border:2px solid #e5e7eb;animation:cardIn .6s .25s both cubic-bezier(.22,1,.36,1)}
.input-section h2{font-size:1.1em;color:#555;margin-bottom:16px;text-align:center}
.flex-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.item{flex:1 1 60px;min-width:60px;display:flex;flex-direction:column;align-items:center;background:#fff;padding:11px 7px;border-radius:13px;border:1px solid #e5e7eb;animation:cardIn .5s both cubic-bezier(.22,1,.36,1)}
.item:nth-child(1){animation-delay:.12s}.item:nth-child(2){animation-delay:.17s}.item:nth-child(3){animation-delay:.22s}.item:nth-child(4){animation-delay:.27s}.item:nth-child(5){animation-delay:.32s}.item:nth-child(6){animation-delay:.37s}.item:nth-child(7){animation-delay:.42s}.item:nth-child(8){animation-delay:.47s}.item:nth-child(9){animation-delay:.52s}.item:nth-child(10){animation-delay:.57s}
.item:hover{background:#e7fbf8}
label{font-size:.85em;margin-bottom:7px;font-weight:700;color:#555}
input[type=number]{width:60px;padding:8px 5px;border-radius:9px;border:2px solid #ccc;text-align:center;font-size:.95em;outline:none;transition:border-color .3s ease,background .3s ease}
input[type=number]:focus{border-color:#00796b;background:#f0fffe}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.result{margin-top:0;text-align:center;font-size:1.8em;font-weight:700;color:#00796b;min-height:58px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,121,107,.08),rgba(76,175,80,.08));border-radius:14px;border:2px solid rgba(0,121,107,.2);animation:resultIn .6s .35s both cubic-bezier(.22,1,.36,1)}
@keyframes containerIn{from{opacity:0;transform:translateY(35px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes titleIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes resultIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@media(max-width:500px){
 body{padding:12px}
 .container{padding:18px;width:100%;margin:0 auto 20px}
 .input-section{padding:14px;margin-bottom:18px}
 .item{flex:1 1 42px;min-width:42px}
 input[type=number]{width:44px}
 .result{font-size:1.4em}
}
@media(max-width:500px) and (max-height:700px){
 .container{margin-top:4px}
 h1{font-size:1.6em;margin-bottom:20px}
 .input-section{padding:12px;margin-bottom:14px}
 .flex-row{gap:9px}
 .item{padding:8px 5px}
 .result{margin-top:0}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="container" id="app">
<h1>💰 Cash Counting</h1>
<div class="input-section">
<h2>Amount Enter Karein</h2>
<div class="flex-row">
<div class="item"><label for="note2000">₹2000</label><input type="number" id="note2000" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="note500">₹500</label><input type="number" id="note500" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="note200">₹200</label><input type="number" id="note200" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="note100">₹100</label><input type="number" id="note100" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="note50">₹50</label><input type="number" id="note50" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="note20">₹20</label><input type="number" id="note20" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="coin10">₹10</label><input type="number" id="coin10" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="coin5">₹5</label><input type="number" id="coin5" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="coin2">₹2</label><input type="number" id="coin2" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="coin1">₹1</label><input type="number" id="coin1" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
</div>
</div>
<div class="result" id="result" aria-live="polite">Total Cash: ₹0</div>
</div>
<script>
const values=[2000,500,200,100,50,20,10,5,2,1];
const inputs=[...document.querySelectorAll('input[type="number"]')];
const result=document.getElementById('result');
let currentTotal=0;
let keyboardOpen=false;
let visibilityTimers=[];
let visibilityFrame=0;

function formatCurrency(value){return `Total Cash: ₹${Math.max(0,Math.round(value)).toLocaleString('en-IN')}`}

function getTotal(){
 return inputs.reduce((total,input,index)=>{
   const value=Number(input.value);
   return total+(Number.isFinite(value)&&value>0?Math.floor(value):0)*values[index];
 },0);
}

function calculateTotal(){
 const total=getTotal();
 result.textContent=formatCurrency(total);
 currentTotal=total;
}

function resetAll(){
 inputs.forEach(input=>{input.value='';});
 calculateTotal();
 inputs[0]?.focus();
}

function clearCurrentInput(input){
 if(!input) return;
 input.value='';
 calculateTotal();
}

function moveToInput(index){
 if(index<0 || index>=inputs.length) return;
 inputs[index].focus();
 inputs[index].select();
 scheduleInputVisibility(inputs[index]);
}

function adjustCurrentInput(input,delta){
 if(!input) return;
 const current=Math.max(0,Math.floor(Number(input.value)||0));
 input.value=String(Math.max(0,current+delta));
 calculateTotal();
 scheduleInputVisibility(input);
}

function keyboardIsOpen(){
 if(!window.visualViewport) return keyboardOpen;
 return window.innerHeight-window.visualViewport.height>80;
}

function keepInputVisible(input,behavior='auto'){
 if(!input || document.activeElement!==input || !document.body.contains(input)) return;
 if(!keyboardIsOpen() && window.visualViewport) return;

 const viewport=window.visualViewport;
 const visibleHeight=viewport?viewport.height:window.innerHeight;
 const viewportTop=viewport?viewport.offsetTop:0;
 const rect=input.getBoundingClientRect();
 const targetY=viewportTop+visibleHeight*0.75;
 const delta=rect.top+(rect.height/2)-targetY;

 if(Math.abs(delta)>8){
   window.scrollBy({top:delta,behavior});
 }
}

function scheduleInputVisibility(input){
 visibilityTimers.forEach(clearTimeout);
 visibilityTimers=[];
 cancelAnimationFrame(visibilityFrame);
 const run=()=>{
   if(document.activeElement===input) keepInputVisible(input,'auto');
 };
 visibilityFrame=requestAnimationFrame(run);
 [60,160,300,500,800].forEach(delay=>{
   visibilityTimers.push(setTimeout(run,delay));
 });
}

inputs.forEach(input=>{
 input.addEventListener('input',()=>{
   if(input.value!=='' && Number(input.value)<0) input.value='0';
   if(input.value.includes('.')) input.value=String(Math.floor(Number(input.value)));
   calculateTotal();
   scheduleInputVisibility(input);
 });
 input.addEventListener('focus',()=>{
   keyboardOpen=true;
   scheduleInputVisibility(input);
 });
 input.addEventListener('blur',()=>{
   input.value=input.value===''?'':String(Math.max(0,Math.floor(Number(input.value)||0)));
 });
});

// Keyboard shortcuts:
// Enter = next denomination, Shift+Enter = previous denomination
// Ctrl/Cmd+Enter = calculate total
// Escape = clear focused field
// + / ArrowUp = add 1, - / ArrowDown = subtract 1
// Ctrl/Cmd+R = reset all fields
// Ctrl/Cmd+Backspace = clear all fields

document.addEventListener('keydown',event=>{
 const active=document.activeElement;
 const focusedInput=active?.matches('input[type="number"]')?active:null;
 const modifier=event.ctrlKey||event.metaKey;

 if(modifier && event.key.toLowerCase()==='r'){
   event.preventDefault();
   resetAll();
   return;
 }

 if(modifier && event.key==='Backspace'){
   event.preventDefault();
   resetAll();
   return;
 }

 if(modifier && event.key==='Enter'){
   event.preventDefault();
   calculateTotal();
   return;
 }

 if(!focusedInput) return;

 if(event.key==='Enter'){
   event.preventDefault();
   const index=inputs.indexOf(focusedInput);
   moveToInput(event.shiftKey?index-1:index+1);
   return;
 }

 if(event.key==='Escape'){
   event.preventDefault();
   clearCurrentInput(focusedInput);
   return;
 }

 if(event.key==='+' || event.key==='ArrowUp'){
   event.preventDefault();
   adjustCurrentInput(focusedInput,1);
   return;
 }

 if(event.key==='-' || event.key==='ArrowDown'){
   event.preventDefault();
   adjustCurrentInput(focusedInput,-1);
 }
});

document.addEventListener('pointerdown',event=>{
 if(!event.target.closest('input[type="number"]')) keyboardOpen=false;
});

document.addEventListener('focusin',event=>{
 if(event.target.matches('input[type="number"]')){
   keyboardOpen=true;
   scheduleInputVisibility(event.target);
 }
});

if(window.visualViewport){
 const handleViewportChange=()=>{
   const active=document.activeElement;
   if(active?.matches('input[type="number"]')){
     keyboardOpen=true;
     scheduleInputVisibility(active);
   }
 };
 window.visualViewport.addEventListener('resize',handleViewportChange);
 window.visualViewport.addEventListener('scroll',handleViewportChange);
}

calculateTotal();
</script>
</body>
</html>
