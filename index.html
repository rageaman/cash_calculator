<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Counting App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#74ebd5,#acb6e5);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;overflow-x:hidden}
body::before{content:"";position:fixed;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.18);top:-100px;left:-100px;filter:blur(2px);animation:float 7s ease-in-out infinite}
body::after{content:"";position:fixed;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14);bottom:-80px;right:-60px;animation:float 9s ease-in-out infinite reverse}
.container{position:relative;z-index:1;background:rgba(255,255,255,.94);padding:24px;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.18);width:95%;max-width:750px;animation:containerIn .8s cubic-bezier(.22,1,.36,1);backdrop-filter:blur(10px)}
h1{text-align:center;font-size:1.9em;margin-bottom:22px;color:#333;animation:titleIn .8s .15s both cubic-bezier(.22,1,.36,1)}
.flex-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.item{flex:1 1 60px;min-width:60px;display:flex;flex-direction:column;align-items:center;background:#f5f7f7;padding:11px 7px;border-radius:13px;transition:transform .35s cubic-bezier(.22,1,.36,1),background .3s ease,box-shadow .35s ease;animation:cardIn .55s both cubic-bezier(.22,1,.36,1)}
.item:nth-child(1){animation-delay:.12s}.item:nth-child(2){animation-delay:.17s}.item:nth-child(3){animation-delay:.22s}.item:nth-child(4){animation-delay:.27s}.item:nth-child(5){animation-delay:.32s}.item:nth-child(6){animation-delay:.37s}.item:nth-child(7){animation-delay:.42s}.item:nth-child(8){animation-delay:.47s}.item:nth-child(9){animation-delay:.52s}.item:nth-child(10){animation-delay:.57s}
.item:hover{transform:translateY(-7px) scale(1.04);background:#e7fbf8;box-shadow:0 10px 22px rgba(0,121,107,.18)}
label{font-size:.85em;margin-bottom:7px;font-weight:700;color:#555}
input[type=number]{width:60px;padding:8px 5px;border-radius:9px;border:2px solid #ccc;text-align:center;font-size:.95em;outline:none;transition:border-color .3s ease,box-shadow .3s ease,transform .25s ease,background .3s ease}
input[type=number]:focus{border-color:#00796b;box-shadow:0 0 0 4px rgba(0,121,107,.12);background:#f0fffe;transform:scale(1.06)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.result{margin-top:25px;text-align:center;font-size:1.8em;font-weight:700;color:#00796b;min-height:58px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,121,107,.06),rgba(116,235,213,.08));border-radius:14px;padding:15px;transition:transform .25s ease,box-shadow .25s ease;animation:resultIn .7s .65s both cubic-bezier(.22,1,.36,1)}
.result.updated{animation:resultPop .4s cubic-bezier(.22,1,.36,1)}
@keyframes containerIn{from{opacity:0;transform:translateY(35px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes titleIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes resultIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes resultPop{0%{transform:scale(1)}45%{transform:scale(1.035);box-shadow:0 8px 25px rgba(0,121,107,.15)}100%{transform:scale(1);box-shadow:none}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(25px,20px)}}
@media(max-width:500px){.container{padding:18px}.item{flex:1 1 42px;min-width:42px}.item:hover{transform:translateY(-4px) scale(1.02)}input[type=number]{width:44px}.result{font-size:1.4em}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="container">
<h1>💰 Cash Counting</h1>
<div class="flex-row">
<div class="item"><label>₹2000</label><input type="number" id="note2000" min="0"></div>
<div class="item"><label>₹500</label><input type="number" id="note500" min="0"></div>
<div class="item"><label>₹200</label><input type="number" id="note200" min="0"></div>
<div class="item"><label>₹100</label><input type="number" id="note100" min="0"></div>
<div class="item"><label>₹50</label><input type="number" id="note50" min="0"></div>
<div class="item"><label>₹20</label><input type="number" id="note20" min="0"></div>
<div class="item"><label>₹10</label><input type="number" id="coin10" min="0"></div>
<div class="item"><label>₹5</label><input type="number" id="coin5" min="0"></div>
<div class="item"><label>₹2</label><input type="number" id="coin2" min="0"></div>
<div class="item"><label>₹1</label><input type="number" id="coin1" min="0"></div>
</div>
<div class="result" id="result">Total Cash: ₹0</div>
</div>
<script>
const values=[2000,500,200,100,50,20,10,5,2,1];
const inputs=[...document.querySelectorAll('input[type="number"]')];
const result=document.getElementById('result');
let currentTotal=0;
let animationFrame;
function animateCounter(start,end,duration=450){cancelAnimationFrame(animationFrame);const startTime=performance.now();function tick(now){const p=Math.min((now-startTime)/duration,1);const eased=1-Math.pow(1-p,3);const value=Math.round(start+(end-start)*eased);result.textContent=`Total Cash: ₹${value.toLocaleString('en-IN')}`;if(p<1)animationFrame=requestAnimationFrame(tick)}animationFrame=requestAnimationFrame(tick)}
function calculateTotal(){let total=0;inputs.forEach((input,i)=>{total+=(Number(input.value)||0)*values[i]});result.classList.remove('updated');void result.offsetWidth;result.classList.add('updated');if(total!==currentTotal){animateCounter(currentTotal,total);currentTotal=total}}
inputs.forEach(input=>input.addEventListener('input',calculateTotal));
</script>
</body>
</html>
