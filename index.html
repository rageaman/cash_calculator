<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Counting App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #acb6e5);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    animation: backgroundShift 8s ease-in-out infinite;
  }

  @keyframes backgroundShift {
    0%, 100% {
      background: linear-gradient(135deg, #74ebd5, #acb6e5);
    }
    50% {
      background: linear-gradient(135deg, #acb6e5, #74ebd5);
    }
  }

  .container {
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    width: 95%;
    max-width: 750px;
    animation: slideInUp 0.6s ease-out;
  }

  @keyframes slideInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  h1 {
    text-align: center;
    font-size: 1.8em;
    margin-bottom: 20px;
    color: #333;
    animation: fadeInDown 0.8s ease-out;
  }

  @keyframes fadeInDown {
    from {
      opacity: 0;
      transform: translateY(-20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .flex-row {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: space-between;
  }

  .item {
    flex: 1 1 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #f5f5f5;
    padding: 10px;
    border-radius: 10px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                background 0.3s ease, 
                box-shadow 0.3s ease;
    animation: fadeInScale 0.6s ease-out backwards;
  }

  .item:nth-child(1) { animation-delay: 0.1s; }
  .item:nth-child(2) { animation-delay: 0.15s; }
  .item:nth-child(3) { animation-delay: 0.2s; }
  .item:nth-child(4) { animation-delay: 0.25s; }
  .item:nth-child(5) { animation-delay: 0.3s; }
  .item:nth-child(6) { animation-delay: 0.35s; }
  .item:nth-child(7) { animation-delay: 0.4s; }
  .item:nth-child(8) { animation-delay: 0.45s; }
  .item:nth-child(9) { animation-delay: 0.5s; }
  .item:nth-child(10) { animation-delay: 0.55s; }

  @keyframes fadeInScale {
    from {
      opacity: 0;
      transform: scale(0.8);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .item:hover {
    transform: translateY(-5px) scale(1.05);
    background: #e0f7fa;
    box-shadow: 0 5px 15px rgba(0, 121, 107, 0.3);
  }

  label {
    font-size: 0.85em;
    margin-bottom: 5px;
    font-weight: bold;
    color: #555;
    text-align: center;
  }

  input[type="number"] {
    width: 60px;
    padding: 6px;
    border-radius: 8px;
    border: 2px solid #ccc;
    text-align: center;
    font-size: 0.9em;
    outline: none;
    transition: border 0.3s ease, 
                box-shadow 0.3s ease, 
                background 0.3s ease;
  }

  input[type="number"]:focus {
    border-color: #00796b;
    box-shadow: 0 0 8px rgba(0,121,107,0.5);
    background: #f0fffe;
  }

  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .result {
    margin-top: 30px;
    text-align: center;
    font-size: 1.8em;
    font-weight: bold;
    color: #00796b;
    animation: fadeInResult 0.8s ease-out;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(0, 121, 107, 0.05), rgba(116, 235, 213, 0.05));
    border-radius: 10px;
    padding: 15px;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .result.updated {
    animation: resultPulse 0.5s ease-out;
  }

  @keyframes fadeInResult {
    from {
      opacity: 0;
      transform: scale(0.9);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  @keyframes resultPulse {
    0% {
      transform: scale(1);
      box-shadow: 0 0 0 0 rgba(0, 121, 107, 0.7);
    }
    50% {
      transform: scale(1.02);
      box-shadow: 0 0 15px 5px rgba(0, 121, 107, 0);
    }
    100% {
      transform: scale(1);
      box-shadow: 0 0 0 0 rgba(0, 121, 107, 0);
    }
  }

  @media (max-width: 500px) {
    .item { flex: 1 1 40px; }
    input[type="number"] { width: 40px; }
    .result { font-size: 1.4em; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>💰 Cash Counting</h1>
  <div class="flex-row">
    <div class="item"><label>₹2000</label><input type="number" id="note2000" min="0" placeholder=""></div>
    <div class="item"><label>₹500</label><input type="number" id="note500" min="0" placeholder=""></div>
    <div class="item"><label>₹200</label><input type="number" id="note200" min="0" placeholder=""></div>
    <div class="item"><label>₹100</label><input type="number" id="note100" min="0" placeholder=""></div>
    <div class="item"><label>₹50</label><input type="number" id="note50" min="0" placeholder=""></div>
    <div class="item"><label>₹20</label><input type="number" id="note20" min="0" placeholder=""></div>
    <div class="item"><label>₹10</label><input type="number" id="coin10" min="0" placeholder=""></div>
    <div class="item"><label>₹5</label><input type="number" id="coin5" min="0" placeholder=""></div>
    <div class="item"><label>₹2</label><input type="number" id="coin2" min="0" placeholder=""></div>
    <div class="item"><label>₹1</label><input type="number" id="coin1" min="0" placeholder=""></div>
  </div>

  <div class="result" id="result">Total Cash: ₹0</div>
</div>

<script>
const ids = ["note2000","note500","note200","note100","note50","note20","coin10","coin5","coin2","coin1"];
let currentTotal = 0;

function animateCounter(start, end, duration = 400) {
  const startTime = performance.now();
  
  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const current = Math.floor(start + (end - start) * progress);
    
    document.getElementById('result').innerText = "Total Cash: ₹" + current;
    
    if (progress < 1) {
      requestAnimationFrame(update);
    } else {
      document.getElementById('result').innerText = "Total Cash: ₹" + end;
    }
  }
  
  requestAnimationFrame(update);
}

function calculateTotal() {
  let total = 0;
  ids.forEach(id => {
    const val = Number(document.getElementById(id).value) || 0;
    const multiplier = parseInt(id.replace(/\D/g,'')) || 1;
    total += val * multiplier;
  });
  
  // Add pulse animation
  const resultElement = document.getElementById('result');
  resultElement.classList.remove('updated');
  void resultElement.offsetWidth; // Trigger reflow
  resultElement.classList.add('updated');
  
  // Animate counter only if value changed
  if (total !== currentTotal) {
    animateCounter(currentTotal, total);
    currentTotal = total;
  }
}

// Live calculation
ids.forEach(id => {
  document.getElementById(id).addEventListener('input', calculateTotal);
});
</script>

</body>
</html>
