<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cash Counting App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-bottom:24px}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#74ebd5,#acb6e5);min-height:100vh;min-height:100svh;display:flex;justify-content:center;align-items:flex-start;padding:20px;overflow-x:hidden;overflow-y:auto}
body::before{content:"";position:fixed;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.18);top:-100px;left:-100px;filter:blur(2px);animation:float 7s ease-in-out infinite;pointer-events:none}
body::after{content:"";position:fixed;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14);bottom:-80px;right:-60px;animation:float 9s ease-in-out infinite reverse;pointer-events:none}
.container{position:relative;z-index:1;background:rgba(255,255,255,.94);padding:24px;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.18);width:95%;max-width:750px;margin:auto;animation:containerIn .8s cubic-bezier(.22,1,.36,1);backdrop-filter:blur(10px)}
h1{text-align:center;font-size:1.9em;margin-bottom:22px;color:#333;animation:titleIn .8s .15s both cubic-bezier(.22,1,.36,1)}
.flex-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.item{flex:1 1 60px;min-width:60px;display:flex;flex-direction:column;align-items:center;background:#f5f7f7;padding:11px 7px;border-radius:13px;transition:transform .35s cubic-bezier(.22,1,.36,1),background .3s ease,box-shadow .35s ease;animation:cardIn .55s both cubic-bezier(.22,1,.36,1)}
.item:nth-child(1){animation-delay:.12s}.item:nth-child(2){animation-delay:.17s}.item:nth-child(3){animation-delay:.22s}.item:nth-child(4){animation-delay:.27s}.item:nth-child(5){animation-delay:.32s}.item:nth-child(6){animation-delay:.37s}.item:nth-child(7){animation-delay:.42s}.item:nth-child(8){animation-delay:.47s}.item:nth-child(9){animation-delay:.52s}.item:nth-child(10){animation-delay:.57s}
.item:hover{transform:translateY(-7px) scale(1.04);background:#e7fbf8;box-shadow:0 10px 22px rgba(0,121,107,.18)}
label{font-size:.85em;margin-bottom:7px;font-weight:700;color:#555}
input[type=number]{width:60px;padding:8px 5px;border-radius:9px;border:2px solid #ccc;text-align:center;font-size:.95em;outline:none;transition:border-color .3s ease,box-shadow .3s ease,transform .25s ease,background .3s ease}
input[type=number]:focus{border-color:#00796b;box-shadow:0 0 0 4px rgba(0,121,107,.12);background:#f0fffe;transform:scale(1.06)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.result{margin-top:25px;text-align:center;font-size:1.8em;font-weight:700;color:#00796b;min-height:58px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,121,107,.06),rgba(116,235,213,.08));border-radius:14px;padding:15px;transition:transform .25s ease,box-shadow .25s ease;animation:resultIn .7s .65s both cubic-bezier(.22,1,.36,1)}
.result.updated{animation:resultPop .4s cubic-bezier(.22,1,.36,1)}
@keyframes containerIn{from{opacity:0;transform:translateY(35px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes titleIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes resultIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes resultPop{0%{transform:scale(1)}45%{transform:scale(1.035);box-shadow:0 8px 25px rgba(0,121,107,.15)}100%{transform:scale(1);box-shadow:none}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(25px,20px)}}
@media(max-width:500px){
 body{padding:12px}
 .container{padding:18px;width:100%;margin:0 auto 20px}
 .item{flex:1 1 42px;min-width:42px}
 .item:hover{transform:translateY(-4px) scale(1.02)}
 input[type=number]{width:44px}
 .result{font-size:1.4em}
}
@media(max-width:500px) and (max-height:700px){
 .container{margin-top:4px}
 h1{font-size:1.6em;margin-bottom:16px}
 .flex-row{gap:9px}
 .item{padding:8px 5px}
 .result{margin-top:16px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="container" id="app">
<h1>💰 Cash Counting</h1>
<div class="flex-row">
<div class="item"><label for="note2000">₹2000</label><input type="number" id="note2000" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="note500">₹500</label><input type="number" id="note500" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="note200">₹200</label><input type="number" id="note200" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="note100">₹100</label><input type="number" id="note100" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="note50">₹50</label><input type="number" id="note50" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="note20">₹20</label><input type="number" id="note20" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="coin10">₹10</label><input type="number" id="coin10" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="coin5">₹5</label><input type="number" id="coin5" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="coin2">₹2</label><input type="number" id="coin2" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
<div class="item"><label for="coin1">₹1</label><input type="number" id="coin1" min="0" step="1" inputmode="numeric" autocomplete="off"></div>
</div>
<div class="result" id="result" aria-live="polite">Total Cash: ₹0</div>
</div>
<script>
const values=[2000,500,200,100,50,20,10,5,2,1];
const inputs=[...document.querySelectorAll('input[type="number"]')];
const result=document.getElementById('result');
let currentTotal=0;
let animationFrame=0;
let keyboardOpen=false;

function formatCurrency(value){return `Total Cash: ₹${Math.max(0,Math.round(value)).toLocaleString('en-IN')}`}

function getTotal(){
 return inputs.reduce((total,input,index)=>{
   const value=Number(input.value);
   return total+(Number.isFinite(value)&&value>0?Math.floor(value):0)*values[index];
 },0);
}

function animateCounter(start,end,duration=300){
 cancelAnimationFrame(animationFrame);
 if(start===end){result.textContent=formatCurrency(end);return}
 const startTime=performance.now();
 function tick(now){
   const progress=Math.min((now-startTime)/duration,1);
   const eased=1-Math.pow(1-progress,3);
   result.textContent=formatCurrency(start+(end-start)*eased);
   if(progress<1) animationFrame=requestAnimationFrame(tick);
 }
 animationFrame=requestAnimationFrame(tick);
}

function calculateTotal(){
 const total=getTotal();
 result.classList.remove('updated');
 void result.offsetWidth;
 result.classList.add('updated');
 animateCounter(currentTotal,total);
 currentTotal=total;
}

function scrollInputIntoView(input){
 if(!keyboardOpen) return;
 const viewport=window.visualViewport;
 const visibleBottom=viewport?viewport.height+viewport.offsetTop:window.innerHeight;
 const rect=input.getBoundingClientRect();
 const safeGap=24;
 const keyboardOverlap=viewport?Math.max(0,window.innerHeight-visibleBottom):0;
 const targetBottom=visibleBottom-safeGap-keyboardOverlap;
 if(rect.bottom>targetBottom || rect.top<20){
   const scrollBy=rect.bottom-targetBottom;
   window.scrollBy({top:scrollBy,behavior:'smooth'});
 }
}

inputs.forEach(input=>{
 input.addEventListener('input',()=>{
   if(input.value!=='' && Number(input.value)<0) input.value='0';
   if(input.value.includes('.')) input.value=String(Math.floor(Number(input.value)));
   calculateTotal();
 });
 input.addEventListener('focus',()=>{
   keyboardOpen=true;
   setTimeout(()=>scrollInputIntoView(input),180);
   setTimeout(()=>scrollInputIntoView(input),450);
 });
 input.addEventListener('blur',()=>{input.value=input.value===''?'':String(Math.max(0,Math.floor(Number(input.value)||0)))});
});

document.addEventListener('click',event=>{
 if(!event.target.matches('input[type="number"]')) keyboardOpen=false;
});

if(window.visualViewport){
 const adjustForKeyboard=()=>{
   if(document.activeElement?.matches('input[type="number"]')){
     keyboardOpen=true;
     setTimeout(()=>scrollInputIntoView(document.activeElement),50);
   }
 };
 window.visualViewport.addEventListener('resize',adjustForKeyboard);
 window.visualViewport.addEventListener('scroll',adjustForKeyboard);
}

calculateTotal();
</script>
</body>
</html>
